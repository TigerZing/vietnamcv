name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.32"
  NODE_VERSION: "22"

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vietnamcv_test
          POSTGRES_USER: vietnamcv
          POSTGRES_PASSWORD: vietnamcv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vietnamcv" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vietnamcv:vietnamcv@localhost:5432/vietnamcv_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy .
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests (unit + integration on PostgreSQL 17 and Redis 7)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: services/api/coverage.xml
          if-no-files-found: ignore

  web:
    name: Web (lint, types, tests, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm --filter @vietnamcv/web build
      - name: Install Playwright Chromium
        run: pnpm --filter @vietnamcv/web exec playwright install --with-deps chromium
      - name: End-to-end tests (360px + desktop, axe)
        run: pnpm --filter @vietnamcv/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  contract:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv --directory services/api sync --frozen
      - name: Regenerate schema and client, fail on diff
        run: make openapi-check

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: pip-audit (Python dependencies)
        working-directory: services/api
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict --requirement /tmp/requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high
