version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      web-minor:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /services/api
    schedule: { interval: weekly }
    groups:
      api-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: weekly }
