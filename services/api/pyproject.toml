[project]
name = "vietnamcv-api"
version = "0.1.0"
description = "VietnamCV API and background workers (modular monolith)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "celery[redis]==5.6.3",
    "celery-redbeat==2.4.2",
    "fastapi==0.162.0",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "redis>=5.2,<6.5",  # bounded by kombu[redis]
    "sqlalchemy[asyncio]==2.1.6",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
    "pyjwt[crypto]==2.15.1",
    "httpx==0.28.1",
    "pillow==12.3.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan==2.1.0",
    "celery-types==0.26.0",
    "hypothesis==6.170.9",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "testcontainers[postgres]==4.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["alembic/versions/__init__.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "ASYNC", "PT", "DTZ", "T20", "PL",
]
ignore = [
    "PLR0913",  # FastAPI dependencies legitimately take many parameters
]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder must not shadow the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "PLC0415"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "redbeat.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires PostgreSQL and Redis (testcontainers or TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Core does not depend on feature modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.api", "app.worker"]

[[tool.importlinter.contracts]]
name = "Modules do not import the HTTP or worker entrypoints"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.api", "app.worker", "app.main"]
