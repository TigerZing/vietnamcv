# Install with `uvx pre-commit install`. CI runs the same checks, so hooks are a convenience.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^services/api/
      - id: ruff-format
        files: ^services/api/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm prettier --write --ignore-unknown
        language: system
        files: ^(apps|packages|infra|\.github)/
